# Empêche la mise en pause automatique du projet Supabase (offre gratuite : pause après
# ~7 jours sans activité) en lisant une ligne de la table events tous les 3 jours.
# Secrets requis (Settings → Secrets and variables → Actions) : SUPABASE_URL, SUPABASE_ANON_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY manquants"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase OK"
